<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#000"/></marker></defs><rect width="1000" height="470" fill="#fff"/><text x="30" y="30" font-size="17" font-weight="bold" text-anchor="start" font-style="normal" fill="#000">A. Aggregate impact (used)</text><rect x="30" y="50" width="450" height="70" rx="3" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="255.0" y="79" font-size="16" font-weight="bold" text-anchor="middle" font-style="normal" fill="#000">Exposure trajectories</text><text x="255.0" y="101" font-size="16" font-weight="normal" text-anchor="middle" font-style="normal" fill="#000">S0 vs DIR scenario</text><line x1="255.0" y1="120" x2="255.0" y2="158" stroke="#000" stroke-width="1.4" marker-end="url(#ah)"/><rect x="30" y="160" width="450" height="70" rx="3" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="255.0" y="189" font-size="16" font-weight="bold" text-anchor="middle" font-style="normal" fill="#000">Relative risks by cause</text><text x="255.0" y="211" font-size="16" font-weight="normal" text-anchor="middle" font-style="normal" fill="#000">→ PIF by sex, age, cause, year</text><line x1="255.0" y1="230" x2="255.0" y2="268" stroke="#000" stroke-width="1.4" marker-end="url(#ah)"/><rect x="30" y="270" width="450" height="70" rx="3" fill="#fff" stroke="#000" stroke-width="1.4"/><text x="255.0" y="299" font-size="16" font-weight="bold" text-anchor="middle" font-style="normal" fill="#000">Expected deaths avoided</text><text x="255.0" y="321" font-size="16" font-weight="normal" text-anchor="middle" font-style="normal" fill="#000">D_ref × PIF; YPLL by age</text><text x="30" y="400" font-size="15.5" font-weight="normal" text-anchor="start" font-style="normal" fill="#000">No additional survivors inside the model.</text><text x="30" y="422" font-size="15.5" font-weight="normal" text-anchor="start" font-style="normal" fill="#000">Example: 100 reference deaths × PIF 0.10</text><text x="30" y="444" font-size="15.5" font-weight="normal" text-anchor="start" font-style="normal" fill="#000">= 10 expected deaths avoided.</text><text x="520" y="30" font-size="17" font-weight="bold" text-anchor="start" font-style="normal" fill="#666">B. Individual survival (alternative, not used)</text><rect x="520" y="50" width="450" height="70" rx="3" fill="#fff" stroke="#666" stroke-width="1.4"/><text x="745.0" y="79" font-size="16" font-weight="bold" text-anchor="middle" font-style="normal" fill="#666">Exposure trajectories</text><text x="745.0" y="101" font-size="16" font-weight="normal" text-anchor="middle" font-style="normal" fill="#666">S0 vs DIR scenario</text><line x1="745.0" y1="120" x2="745.0" y2="158" stroke="#000" stroke-width="1.4" marker-end="url(#ah)"/><rect x="520" y="160" width="450" height="70" rx="3" fill="#fff" stroke="#666" stroke-width="1.4"/><text x="745.0" y="189" font-size="16" font-weight="bold" text-anchor="middle" font-style="normal" fill="#666">Individual hazard by cause</text><text x="745.0" y="211" font-size="16" font-weight="normal" text-anchor="middle" font-style="normal" fill="#666">baseline rate × RR(exposure)</text><line x1="745.0" y1="230" x2="745.0" y2="268" stroke="#000" stroke-width="1.4" marker-end="url(#ah)"/><rect x="520" y="270" width="450" height="70" rx="3" fill="#fff" stroke="#666" stroke-width="1.4"/><text x="745.0" y="299" font-size="16" font-weight="bold" text-anchor="middle" font-style="normal" fill="#666">Death or survival by scenario</text><text x="745.0" y="321" font-size="16" font-weight="normal" text-anchor="middle" font-style="normal" fill="#666">competing risks; new alive set</text><text x="520" y="400" font-size="15.5" font-weight="normal" text-anchor="start" font-style="normal" fill="#666">Same individuals and random numbers;</text><text x="520" y="422" font-size="15.5" font-weight="normal" text-anchor="start" font-style="normal" fill="#666">deaths may differ. Example: U = 0.03,</text><text x="520" y="444" font-size="15.5" font-weight="normal" text-anchor="start" font-style="normal" fill="#666">p(S0) = 0.04, p(DIR) = 0.02.</text></svg>