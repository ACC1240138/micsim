# Quarto project for the notebooks in __andres_control: rendered HTML goes to the project root (one level up).
# Relative path only (portable across Windows/macOS/Linux). type: default never cleans output-dir (a website
# project would wipe it, and here it is the repository root). Cache in .quarto/ (gitignored).
# Rendering or previewing one notebook renders only that notebook. `render` is used only by a bare
# `quarto render`: every notebook here except the *.before_recovery_* backups.
project:
  type: default
  output-dir: ..
  render:
    - "*.ipynb"
    - "!*.before_recovery_*.ipynb"
